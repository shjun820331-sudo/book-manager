<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>도서 정보 조회 - 북토크 나침반</title>
  <link rel="stylesheet" href="css/style.css" />
</head>
<body>
  <header class="site-header">
    <div class="nav-wrap">
      <a href="index.html" class="logo">북토크 나침반</a>
      <nav class="main-nav">
        <a href="index.html" class="nav-link">홈</a>
        <a href="book-info.html" class="nav-link">도서 정보</a>
        <a href="discussion.html" class="nav-link">토론 주제 추천</a>
        <a href="guide.html" class="nav-link">이용 안내</a>
      </nav>
    </div>
  </header>

  <main>
    <section>
      <h1>도서 정보 조회</h1>
      <p>책 제목을 입력하면 저자 소개와 줄거리를 AI가 알려드려요.</p>

      <form id="book-info-form" class="form-card">
        <div class="form-group">
          <label for="title-input">책 제목</label>
          <input
            type="text"
            id="title-input"
            name="title"
            placeholder="예) 82년생 김지영"
            autocomplete="off"
          />
        </div>
        <button type="submit" id="submit-btn" class="btn btn-primary">조회하기</button>
      </form>

      <div id="message" class="message" role="alert"></div>

      <div id="result" class="result-card" hidden>
        <h3>저자 소개</h3>
        <p id="author-intro"></p>
        <h3>줄거리</h3>
        <p id="summary"></p>
        <button id="go-discussion-btn" class="btn btn-secondary" type="button" hidden>
          이 책으로 토론 주제 추천받기 →
        </button>
      </div>
    </section>
  </main>

  <footer>북토크 나침반 &middot; AI 기반 독서모임 준비 도우미</footer>

  <script src="js/common.js"></script>
  <script src="js/book-info.js"></script>
</body>
</html>
